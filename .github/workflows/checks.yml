name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck
          command -v node
          command -v npm
          scripts/install-ci-yq.sh
      - name: Validate repository without Docker
        run: make check
